IER"},"inputs":[{"id":"project-search","source":{"kind":"puzzle-output","puzzleId":"find-project-name","outputId":"project-name"},"use":"Search the fictional city projects site for the River Cleanup page and open its notice history."}],"outputs":[{"id":"meeting-place","semanticRole":"location","description":"The corrected meeting place used with the event date to find the matching public recap.","from":"verification"}]},"generatedContent":{"status":"mockup","preview":{"kind":"structured","data":{"resource":"City project notice history","comparison":"The earlier and corrected notices list different meeting places."}}}},{"id":"identify-coordinator","phaseId":"event-recap","title":"Inspect the Event Recap","purpose":"Use the cleanup date and meeting place to find the matching recap and identify the coordinator named in its source.","design":{"puzzleType":"hidden-information","subtype":"html-source-inspection","difficulty":"easy","generationSpec":{"mode":"production","id":"identify-coordinator","intendedSolution":"MAYA CHEN","visibleTitle":"River Cleanup Event Recap","visibleBody":"This public recap confirms the cleanup date and meeting place but does not show the coordinator's name in the visible article.","carrier":"html-attribute","codeLabel":"Event coordinator"},"verification":{"prompt":"Enter the coordinator's full name using uppercase letters.","dataType":"string","expectedValue":"MAYA CHEN"},"inputs":[{"id":"date-filter","source":{"kind":"puzzle-output","puzzleId":"find-event-date","outputId":"event-date"},"use":"Filter the fictional community events archive to recaps dated April 18 2026."},{"id":"place-check","source":{"kind":"puzzle-output","puzzleId":"find-meeting-place","outputId":"meeting-place"},"use":"Select the April 18 recap that names East Pier as its meeting place."}],"outputs":[{"id":"coordinator-name","semanticRole":"person-identifier","description":"The coordinator's name submitted as the investigation's final finding.","from":"verification"}]},"gen     function viewAvailable(view){return view==="structure"?Boolean(state.game||state.request):view==="world"?Boolean(state.world):Boolean(state.level)}
    function updateHeader(){els.title.textContent=state.view==="structure"?(state.game?.title||state.request?.titleHint||state.request?.levelId||"Game Structure"):state.view==="world"?(state.world?.id||"Game World"):(state.level?.title||"Level Structure");els.file.textContent=state.fileNames[state.view]||"No file loaded"}
    function renderUnavailable(){const expected=state.view==="structure"?"a complete game-design file or a level-request file":state.view==="world"?"a complete game-design file or a game-world file":"a generated level file",title=`No ${state.view==="structure"?"game structure":state.view==="world"?"game world":"level structure"} loaded`,copy=`Use Load JSON or drag ${expected} onto the inspector.`;els.side.innerHTML=`<div class="empty"><div><h2>${esc(title)}</h2><p>${esc(copy)}</p><p>Loaded views are retained while you add another design file.</p></div></div>`;if(state.view!=="level")els.browse.innerHTML=`<div class="empty"><div><h2>${esc(title)}</h2><p>${esc(copy)}</p></div></div>`}
    function renderActiveSurface(){setSurface();if(!viewAvailable(state.view)){els.edges.replaceChildren();els.nodes.replaceChildren();renderUnavailable();return}if(state.view==="level"){layout();renderGraph();requestAnimationFrame(fit)}else renderBrowseSurface();renderCurrentOverview()}
    function switchView(view){state.view=view;state.selected="overview";state.edgeOffsets.clear();state.positions.clear();state.routes=[];renderTabs();renderTypeLegend();updateHeader();renderActiveSurface()}
    function loadData(value,name){const detected=detect(value);if(detected.errors.length){els.side.innerHTML=`<div class="error"><h2>Cannot inspect file</h2>${detected.errors.map(error=>`<p>${esc(error)}</p>`).join("")}</div>`;return}state.data=value;state.kind=detected.kind;state.view=detected.view;state.fileName=name;state.selected="overview";state.edgeOffsets.clear();if(state.kind==="game"){state.game=value;state.world=value.world;state.request=null;state.fileNames.structure=name;state.fileNames.world=name}else if(state.kind==="world"){state.world=value;state.fileNames.world=name}else if(state.kind==="request"){state.request=value;state.game=null;state.fileNames.structure=name}else if(state.kind==="level"){state.level=value;state.fileNames.level=name}renderTabs();renderTypeLegend();updateHeader();renderActiveSurface()}
    async function openFile(file){try{loadData(JSON.parse(await file.text()),file.name)}catch(error){els.side.innerHTML=`<div class="error"><h2>Invalid JSON</h2><p>${esc(error.message)}</p></div>`}}
    $("file-input").addEventListener("change",e=>e.target.files?.[0]&&openFile(e.target.files[0]));$("overview").addEventListener("click",()=>select("overview"));$("fit").addEventListener("click",fit);
    els.slider.addEventListener("input",()=>{if(state.view!=="level")return;const rect=els.viewport.getBoundingClientRect(),next=Number(els.slider.value)/100,ratio=next/state.scale;state.tx=rect.width/2-(rect.width/2-state.tx)*ratio;state.ty=rect.height/2-(rect.height/2-state.ty)*ratio;state.scale=next;updateTransform()});
    els.viewport.addEventListener("wheel",e=>{if(state.view!=="level")return;e.preventDefault();const rect=els.viewport.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,next=Math.min(1.8,Math.max(.25,state.scale*(e.deltaY<0?1.1:1/1.1))),ratio=next/state.scale;state.tx=x-(x-state.tx)*ratio;state.ty=y-(y-state.ty)*ratio;state.scale=next;updateTransform()},{passive:false});
    els.viewport.addEventListener("pointerdown",e=>{if(state.view!=="level"||e.target.closest?.(".node,.transform-node,.edge-label-group,.edge"))return;state.pan={x:e.clientX,y:e.clientY,bx:state.tx,by:state.ty};els.viewport.classList.add("grabbing");els.viewport.setPointerCapture?.(e.pointerId)});window.addEventListener("pointermove",e=>{if(state.drag?.id){const p=state.positions.get(state.drag.id);p.x=state.drag.bx+(e.clientX-state.drag.x)/state.scale;p.y=state.drag.by+(e.clientY-state.drag.y)/state.scale;renderEdges();renderNodes()}else if(state.drag?.edge){const next=state.drag.base+(e.clientY-state.drag.startY)/state.scale;state.edgeOffsets.set(edgeKey(state.drag.edge),next);renderEdges()}else if(state.pan){state.tx=state.pan.bx+e.clientX-state.pan.x;state.ty=state.pan.by+e.clientY-state.pan.y;updateTransform()}});window.addEventListener("pointerup",e=>{state.drag=null;state.pan=null;els.viewport.classList.remove("grabbing");if(e.pointerId!==undefined)els.viewport.releasePointerCapture?.(e.pointerId)});
    for(const event of["dragenter","dragover"]){els.viewport.addEventListener(event,e=>{e.preventDefault();els.viewport.classList.add("dragover")})}for(const event of["dragleave","drop"]){els.viewport.addEventListener(event,e=>{e.preventDefault();els.viewport.classList.remove("dragover")})}els.viewport.addEventListener("drop",e=>e.dataTransfer.files?.[0]&&openFile(e.dataTransfer.files[0]));
    loadData(SAMPLE_LEVEL,"open-web-example.level.json");
  </script>
</body>
</html>
