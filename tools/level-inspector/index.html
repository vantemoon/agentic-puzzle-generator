<html lang="en">
<head>

  <title>Level Metadata Inspector</title>

    .zoom{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px}.zoom input{accent-color:var(--accent);width:145px}.zoom span{width:42px;text-align:right;font-variant-numeric:tabular-nums}

    @media(max-width:900px){main{grid-template-columns:1fr}aside{position:absolute;right:0;top:146px;bottom:0;width:min(430px,92vw);z-index:3;box-shadow:-20px 0 40px #0009}.zoom{display:none}}@media(max-width:620px){header{gap:8px;padding:10px 12px}.file,#title{display:none}.legend{padding-inline:12px}.legend-title{width:100%}.legend-row{gap:10px 16px}}
  </style>

<body>
  <header>
    <button id="overview">Overview</button>
    <label class="upload"><span>Load JSON</span><input id="file-input" type="file" accept="application/json,.json" aria-label="Load JSON"></label>

    <label class="zoom">Zoom <input id="zoom-slider" type="range" min="25" max="180" value="100"><span id="zoom-value">100%</span></label>

  </header>
  <section class="legend">
    <div class="legend-row"><span class="legend-title">Puzzle types</span><span id="type-legend"></span></div>
    <div class="legend-row" id="connection-legend"><span class="legend-title">Connections</span><span class="legend-item"><i class="line-key"></i>data passed directly</span><span class="legend-item"><i class="line-key transformed"></i>player transforms data</span><span class="legend-item"><i class="terminal-key"></i>terminal action</span></div>
  </section>
  <main>
    <div class="viewport" id="viewport">
      <svg id="graph" aria-label="Level data-flow graph">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7186a4"/></marker>
          <marker id="arrow-transform" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#61e6d1"/></marker>
        </defs>
        <g class="world" id="world"><g id="edges"></g><g id="nodes"></g></g>
      </svg>
    </div>
    <aside><div id="side-content"></div></aside>
  </main>
  <script>
    const SAMPLE_LEVEL={schemaVersion:"3.0.0",catalogVersion:"repository-puzzles-2.0.0",id:"investigate-alex-laptop",title:"The Unsent Message",summary:"Identify the account owner and recover the credentials needed to access the laptop.",genre:"online-investigation",environment:{mode:"self-contained"},setting:{theme:"digital identity",location:"A simulated laptop and company intranet",tone:"focused investigation"},startingSituation:"The investigator has authorized access to a recovered laptop.",playerRole:"authorized digital investigator",playerCapabilities:["browser access"],playerConstraints:["fictional systems only"],startingInputs:[],generationConfig:{structuralDifficulty:{preset:"easy",puzzleCount:{minimum:3,maximum:5},phaseCount:{minimum:1,maximum:2},linearity:.9,maxParallelPuzzles:2},puzzleDifficulty:{preset:"easy",hintPolicy:"explicit"},transformationPolicy:{enabled:true,maxCount:1,maxDifficulty:"easy"},reviewRetryLimit:2,concealUnreachedContent:true,encourageSubtypeVariety:true},phases:[{id:"identify",order:0,title:"Identify the owner",summary:"Identify the employee associated with the laptop."},{id:"credentials",order:1,title:"Recover credentials",summary:"Find the account handle and password."}],puzzles:[{id:"identify-employee",phaseId:"identify",title:"Read the facilities note",purpose:"Identify the employee named by the note's line initials.",design:{puzzleType:"hidden-information",subtype:"cover-text-line-acrostic",difficulty:"easy",hintPolicy:"explicit",generationSpec:{mode:"production",id:"identify-employee",intendedSolution:"MORGAN REED",genre:"facilities note",coverText:"Maintenance begins after closing.\nOffice keys remain with security.\nReport damaged badges promptly.\nGuests must sign the lobby register.\nAccess cards should never be shared.\nNight staff use the east entrance.\nReturn temporary passes before leaving.\nEmergency exits must remain clear.\nEquipment faults go to facilities.\nDesk drawers are not secure storage."},verification:{prompt:"Enter the full employee name hidden by the line initials.",dataType:"string",expectedValue:"MORGAN REED"},inputs:[],outputs:[{id:"employee-name",semanticRole:"person-identifier",description:"The employee name used to search the company directory.",from:"verification"}]},generatedContent:{status:"mockup",preview:{kind:"text",title:"Facilities note",body:"Maintenance begins after closing.\nOffice keys remain with security.\nReport damaged badges promptly.\nGuests must sign the lobby register.\nAccess cards should never be shared.\nNight staff use the east entrance.\nReturn temporary passes before leaving.\nEmergency exits must remain clear.\nEquipment faults go to facilities.\nDesk drawers are not secure storage.",emphasis:"acrostic"}}},{id:"find-account-name",phaseId:"credentials",title:"Search the employee directory",purpose:"Use the name to select the employee record and recover its account handle.",design:{puzzleType:"encoding",subtype:"caesar-cipher",difficulty:"easy",hintPolicy:"explicit",generationSpec:{mode:"production",id:"find-account-name",intendedSolution:"mreed",shift:5},verification:{prompt:"Enter the lowercase account handle.",dataType:"string",expectedValue:"mreed"},inputs:[{id:"employee-name",source:{kind:"puzzle-output",puzzleId:"identify-employee",outputId:"employee-name"},use:"Search the company directory for the matching employee record"}],outputs:[{id:"username",semanticRole:"account-identifier",description:"The account handle in the directory record.",from:"verification"}]},generatedContent:{status:"mockup",preview:{kind:"structured",data:{interface:"Company directory",interaction:"Search for the recovered employee name."}}}},{id:"recover-password",phaseId:"credentials",title:"Decode the recovery note",purpose:"Select the account's recovery record and decode its password.",design:{puzzleType:"encoding",subtype:"morse-code",difficulty:"easy",hintPolicy:"explicit",generationSpec:{mode:"production",id:"recover-password",intendedSolution:"EMBER-0420"},verification:{prompt:"Enter the password exactly as decoded.",dataType:"string",expectedValue:"EMBER-0420"},inputs:[{id:"username",source:{kind:"puzzle-output",puzzleId:"find-account-name",outputId:"username"},use:"Select the recovery record for the recovered account"}],outputs:[{id:"password",semanticRole:"authentication-secret",description:"The password decoded from the recovery record.",from:"verification"}]},generatedContent:{status:"mockup",preview:{kind:"text",title:"Recovery record",body:"The record for mreed contains a short Morse-encoded credential.",emphasis:"code"}}}],terminalAction:{id:"login",actionType:"account-login",title:"Log into the recovered laptop",description:"Log into the recovered laptop account.",interaction:"exact-field-form",fields:[{id:"username",label:"Username",semanticRole:"account-identifier",source:{puzzleId:"find-account-name",outputId:"username"}},{id:"password",label:"Password",semanticRole:"authentication-secret",source:{puzzleId:"recover-password",outputId:"password"}}],successOutcome:"The laptop account opens and the local inbox becomes available."},externalContentRequirements:[]};

    const $=id=>document.getElementById(id),els={viewport:$("viewport"),world:$("world"),edges:$("edges"),nodes:$("nodes"),side:$("side-content"),title:$("title"),file:$("file-name"),slider:$("zoom-slider"),zoom:$("zoom-value"),types:$("type-legend")};
    const state={level:SAMPLE_LEVEL,fileName:"built-in-example.level.json",selected:"overview",positions:new Map(),routes:[],scale:1,tx:40,ty:35,drag:null,pan:null,edgeOffsets:new Map()};
    const NS="http://www.w3.org/2000/svg",CARD_W=330,CARD_H=116,START_W=250,START_H=84,TRANS_W=190,TRANS_H=58,TERM_W=350,TERM_H=112;
    const COLORS=["#61e6d1","#8295ff","#ffbd59","#f07cac","#6cdb82","#c792ea","#58b6ff","#ff7b8c"];
    const arr=v=>Array.isArray(v)?v:[],esc=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[c]);
    const pretty=v=>JSON.stringify(v,null,2),truncate=(v,n=34)=>String(v??"").length>n?String(v).slice(0,n-1)+"…":String(v??"");
    const byId=(items,id)=>arr(items).find(x=>x?.id===id),sourceKey=s=>s?.kind==="puzzle-output"?`${s.puzzleId}.${s.outputId}`:`starting:${s?.inputId}`;
    function output(puzzleId,outputId){const p=byId(state.level.puzzles,puzzleId),o=arr(p?.design?.outputs).find(x=>x.id===outputId);if(!p||!o)return null;return o.from==="verification"?{...p.design.verification,value:p.design.verification.expectedValue,meta:o}:{dataType:o.dataType,value:o.value,meta:o}}
    function types(){return [...new Set(arr(state.level.puzzles).map(p=>p.design?.puzzleType).filter(Boolean))]}
    function color(type){return COLORS[Math.max(0,types().indexOf(type))%COLORS.length]}
    function renderTypeLegend(){els.types.innerHTML=types().map(t=>`<span class="legend-item"><i class="dot" style="background:${color(t)}"></i>${esc(t.replaceAll("-"," "))}</span>`).join("")}
    function validate(level){const errors=[];if(!level||typeof level!=="object")return["The file is not a JSON object."];if(level.schemaVersion!=="3.0.0")errors.push("This inspector expects schemaVersion 3.0.0.");if(!Array.isArray(level.puzzles))errors.push("Missing puzzles array.");if(!level.terminalAction)errors.push("Missing terminalAction.");const ids=new Set(arr(level.puzzles).map(p=>p.id));for(const p of arr(level.puzzles))for(const input of arr(p.design?.inputs))if(input.source?.kind==="puzzle-output"&&!ids.has(input.source.puzzleId))errors.push(`${p.id} references missing puzzle ${input.source.puzzleId}.`);return errors}
    function sourceNode(source){return source?.kind==="puzzle-output"?source.puzzleId:`starting:${source?.inputId}`}
    function sourceLabel(source){return source?.kind==="puzzle-output"?source.outputId:source?.inputId}
    function records(){const result=arr(state.level.startingInputs).map(input=>({id:`starting:${input.id}`,kind:"starting",data:input,w:START_W,h:START_H}));result.push(...arr(state.level.puzzles).map(p=>({id:p.id,kind:"puzzle",data:p,w:CARD_W,h:CARD_H})));for(const p of arr(state.level.puzzles))for(const input of arr(p.design?.inputs))if(input.transform)result.push({id:`transform:${p.id}:${input.id}`,kind:"transform",data:{...input.transform,input,puzzle:p},w:TRANS_W,h:TRANS_H});result.push({id:"terminal",kind:"terminal",data:state.level.terminalAction,w:TERM_W,h:TERM_H});return result}
    function dependencyLinks(){const out=[];for(const p of arr(state.level.puzzles))for(const input of arr(p.design?.inputs))out.push({from:sourceNode(input.source),to:p.id});for(const f of arr(state.level.terminalAction?.fields))out.push({from:f.source.puzzleId,to:"terminal"});return out}
    function links(){const out=[];for(const p of arr(state.level.puzzles))for(const input of arr(p.design?.inputs)){const from=sourceNode(input.source),label=sourceLabel(input.source),base=`input:${p.id}:${input.id}`;if(input.transform){const tid=`transform:${p.id}:${input.id}`;out.push({id:`${base}:transform`,from,to:tid,type:"transformed",label:input.transform.type,use:iUse(input)});out.push({id:`${base}:value`,from:tid,to:p.id,type:"transformed",label:label||"transformed value",use:iUse(input)})}else out.push({id:base,from,to:p.id,type:"direct",label:label,use:iUse(input)})}for(const f of arr(state.level.terminalAction?.fields))out.push({id:`terminal:${f.id}:${f.source.puzzleId}:${f.source.outputId}`,from:f.source.puzzleId,to:"terminal",type:"direct",label:f.label,use:`Submit as ${f.label}`});return out}
    function iUse(input){return input?.use||"Data passed to the next artifact."}
    function orderKey(id){if(id.startsWith("starting:"))return -1000;if(id.startsWith("transform:")){const target=id.split(":")[1],index=arr(state.level.puzzles).findIndex(p=>p.id===target);return index>=0?index-.25:4999}const index=arr(state.level.puzzles).findIndex(p=>p.id===id);if(index>=0)return index;return id==="terminal"?10000:5000}
    function layout(){const rs=records(),byRecord=new Map(rs.map(r=>[r.id,r])),ids=rs.map(r=>r.id),allLinks=links(),incoming=new Map(ids.map(id=>[id,0])),outgoing=new Map(ids.map(id=>[id,[]])),rank=new Map(ids.map(id=>[id,0]));for(const e of allLinks){if(!incoming.has(e.to)||!outgoing.has(e.from))continue;incoming.set(e.to,incoming.get(e.to)+1);outgoing.get(e.from).push(e.to)}let frontier=ids.filter(id=>incoming.get(id)===0).sort((a,b)=>orderKey(a)-orderKey(b)),seen=new Set;while(frontier.length){const id=frontier.shift();if(seen.has(id))continue;seen.add(id);for(const to of outgoing.get(id).sort((a,b)=>orderKey(a)-orderKey(b))){rank.set(to,Math.max(rank.get(to)||0,(rank.get(id)||0)+1));incoming.set(to,incoming.get(to)-1);if(incoming.get(to)===0)frontier.push(to)}frontier.sort((a,b)=>orderKey(a)-orderKey(b))}for(const id of ids)if(!seen.has(id))rank.set(id,Math.max(0,rank.get(id)||0));const layers=new Map;for(const id of ids){const r=rank.get(id)||0;if(!layers.has(r))layers.set(r,[]);layers.get(r).push(id)}for(const layer of layers.values())layer.sort((a,b)=>orderKey(a)-orderKey(b));state.positions.clear();const colGap=250,marginX=240,marginY=110,ranks=[...layers.keys()].sort((a,b)=>a-b),rowWidths=new Map(ranks.map(r=>[r,layers.get(r).reduce((sum,id,index)=>sum+(byRecord.get(id)?.w||CARD_W)+(index?colGap:0),0)])),canvasW=Math.max(...rowWidths.values(),CARD_W);let y=marginY;for(let ri=0;ri<ranks.length;ri++){const r=ranks[ri],idsInLayer=layers.get(r),rowW=rowWidths.get(r);let x=marginX+(canvasW-rowW)/2;const rowH=Math.max(...idsInLayer.map(id=>byRecord.get(id)?.h||CARD_H));for(const id of idsInLayer){const rec=byRecord.get(id);state.positions.set(id,{x,y:y+(rowH-rec.h)/2,w:rec.w,h:rec.h,rank:r});x+=rec.w+colGap}const nextIds=new Set(layers.get(ranks[ri+1])||[]),approachCount=Math.max(1,allLinks.filter(e=>nextIds.has(e.to)).length),rowGap=Math.max(230,92+approachCount*72);y+=rowH+rowGap}buildRoutes()}
    function svg(name,attrs={}){const e=document.createElementNS(NS,name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,String(v));return e}
    function nodePort(rect,index,count,side){const ratio=count<=1?.5:(index+1)/(count+1);if(side==="left"||side==="right"){const pad=Math.min(25,rect.h*.22),usable=Math.max(0,rect.h-pad*2);return{x:side==="left"?rect.x:rect.x+rect.w,y:rect.y+pad+usable*ratio}}const pad=Math.min(36,rect.w*.16),usable=Math.max(0,rect.w-pad*2);return{x:rect.x+pad+usable*ratio,y:side==="bottom"?rect.y+rect.h:rect.y}}
    function edgeKey(edge){return edge.id}
    function labelLines(value,max=25){const words=String(value||"").trim().split(/\s+/),lines=[];for(const word of words){const current=lines.at(-1);if(!current||current.length+word.length+1>max)lines.push(word);else lines[lines.length-1]=`${current} ${word}`}return lines.length?lines:[""]}
    function buildRoutes(){
      const es=links(),edgeOrder=new Map(es.map((e,i)=>[e.id,i])),incoming=new Map;
      for(const e of es){if(!incoming.has(e.to))incoming.set(e.to,[]);incoming.get(e.to).push(e)}
      const center=id=>{const p=state.positions.get(id);return p?p.x+p.w/2:0};
      for(const group of incoming.values())group.sort((a,b)=>center(a.from)-center(b.from)||(edgeOrder.get(a.id)-edgeOrder.get(b.id)));
      const longEdges=es.filter(e=>{const a=state.positions.get(e.from),b=state.positions.get(e.to);return a&&b&&b.rank-a.rank>1}).sort((a,b)=>edgeOrder.get(a.id)-edgeOrder.get(b.id)),longIndex=new Map(longEdges.map((e,i)=>[e.id,i])),sourceSide=new Map,positionEntries=[...state.positions.entries()];
      for(const e of es){const a=state.positions.get(e.from),b=state.positions.get(e.to);if(!a||!b)continue;const li=longIndex.get(e.id);if(li!==undefined){const peers=positionEntries.filter(([id,p])=>id!==e.from&&p.rank===a.rank),sourceCenter=a.x+a.w/2,blockedLeft=peers.some(([,p])=>p.x+p.w/2<sourceCenter),blockedRight=peers.some(([,p])=>p.x+p.w/2>sourceCenter);sourceSide.set(e.id,!blockedLeft&&blockedRight?"left":blockedLeft&&!blockedRight?"right":li%2===0?"left":"right")}else{const dx=b.x+b.w/2-(a.x+a.w/2);sourceSide.set(e.id,dx>80?"right":dx< -80?"left":"bottom")}}
      const outgoingBySide=new Map;
      for(const e of es){const key=`${e.from}:${sourceSide.get(e.id)}`;if(!outgoingBySide.has(key))outgoingBySide.set(key,[]);outgoingBySide.get(key).push(e)}
